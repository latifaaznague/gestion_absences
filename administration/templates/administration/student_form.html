<h2>{% if mode == 'edit' %}Modifier{% else %}Créer{% endif %} étudiant</h2>
{% if error %}<p style="color:red;">{{ error }}</p>{% endif %}

<form method="post">
  {% csrf_token %}
  <p>Nom: <input name="nom" value="{{ student.nom }}"></p>
  <p>Prénom: <input name="prenom" value="{{ student.prenom }}"></p>
  <p>Email: <input name="email" value="{{ student.email }}"></p>
  <p>
    Promotion:
     <select name="promotionId" required>
      {% for p in promotions %}
        <option value="{{ p.id }}" {% if student.promotionId == p.id %}selected{% endif %}>{{ p.libelle }}</option>
      {% endfor %}
     </select>
  </p>
  <p>
     Filière:
     <select name="filiereId" required>
        {% for f in filieres %}
          <option value="{{ f.id }}">{{ f.nom }}</option>
        {% endfor %}
     </select>
  </p>


 
  <p>Code étudiant: <input name="codeEtudiant" value="{{ student.codeEtudiant }}"></p>
  <p>Mot de passe: <input name="motDePasse" type="password" value=""></p>

  <button type="submit">Enregistrer</button>
</form>

<p><a href="{% url 'administration:student_list' %}">Retour</a></p>
