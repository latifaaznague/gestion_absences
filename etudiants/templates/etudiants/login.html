{% load static %}

<!DOCTYPE html>
<html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta http-equiv="X-UA-Compatible" content="IE=edge">
      <meta name="viewport" content="width=device-width,initial-scale=1.0">
      <title>Login Form in HTML AND CSS </title> 
     <style>
        
        @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap");
*{
    margin: 0;
    padding: 0;
    box-sizing:border-box;
    font-family:"Poppins",sans-serif;

}

body{
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-image: url('{% static "login.jpg" %}');
    background-repeat: no-repeat;
            background-size: cover;
    background-position: center;
}
body::before{
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-position: right;
    filter: brightness(40%);
    /* background-repeat: no-repeat;
    background-size: cover; */
    z-index:-1;

}

.wrapper{
    width:420px;
    background: transparent;
    border: 2px solid rgba(255, 255,255, .2);
    backdrop-filter: blur(20px);
    box-shadow: 0 0 10px rgb(0, 0, 0, .2);
    color:#fff;
    border-radius: 10px;
    padding: 30px 40px;
}

.wrapper h1 {
    font-size: 36px;
    text-align: center;
}

.wrapper .input-box {
    position: relative;
    width:100%;
    height: 50px;
    margin:30px 0;
}

.input-box input{
    width:100%;
    height: 100%;
    background:transparent;
    border: none;
    outline: none;
    border: 2px solid rgba(255, 255,255, .2);
    border-radius: 40px; 
    font-size: 16px;
    color: #fff;
    padding: 20px 45px 20px 20px;
}

.input-box input::placeholder{
    color: #fff;
}

.input-box i{
    position: absolute;
    right: 20px;
    top:50%;
    transform: translateY(-50%);
    font-size: 20px;

}

.wrapper .remember-forgot {
    accent-color: #fff;
    margin-right: 3px;
} 

.remember-forgot a{
    color: #fff;
    text-decoration: none;
}

.remember-forgot a:hover{
    text-decoration: underline;
}

.wrapper .btn{
    width: 100%;
    height: 45px;
    background: #fff;
    border:none;
    outline: none;
    border-radius: 40px;
    box-shadow: 0 0 10px rgb(0, 0, 0, .1);
    cursor: pointer;
    font-size: 16px;
    color: #333;
    font-weight: 600;
}

.remember-forgot {
    margin-bottom: 20px; 
}

.btn {
    margin-top: 10px; 
}

/* 1. Animation douce sur le voile sombre */
body::before {
    transition: filter 0.5s ease;   /* ← indispensable */
}

/* 2. Quand on survole LE BOUTON → fond plus sombre */
.btn:hover ~ body::before,
body:has(.btn:hover)::before {     /* cette ligne magique marche dans tous les navigateurs modernes */
    filter: brightness(20%) !important;   /* passe de 40% → 20% = bien plus sombre */
}

/* Bonus : petit effet sur le bouton lui-même */
.btn {
    transition: all 0.3s ease;
}
.btn:hover {
    background: #e0e0e0;
    transform: translateY(-4px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.4);
}

.remember-forgot {
    display: flex;
    justify-content: space-between;
    font-size: 14.5px;
    margin: 15px 0 25px;
}

.remember-forgot label {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
}
.remember-forgot input[type="checkbox"] {
    accent-color: #fff;
    width: 18px;
    height: 18px;
    cursor: pointer;
}

.remember-forgot a {
    color:rgba(255, 234, 167, 0.7);           /* couleur douce et moderne (violet clair) */
    font-size: 13.5px;        /* plus petit que le reste */
    text-decoration: none;
    font-weight: 500;
    transition: all 0.3s ease;
}

.remember-forgot a:hover {
    color:  #e0e0e0;              /* devient blanc au survol */
    text-decoration: underline;
    text-underline-offset: 3px;
}


     </style>
      
    </head>
<body>
    <div class="wrapper">
        <h1>Connexion</h1>

        <!-- Affichage de l'alerte si présente -->
        {% if alert %}
        <div style="background-color: #f44336; color: white; padding: 10px; margin-bottom: 15px; border-radius: 5px; text-align: center;">
            {{ alert }}
        </div>
        {% endif %}

        <form name="LoginForm" action="" method="POST" >
            {% csrf_token %}

            <div class="input-box">
                <input type="text"  id="id_username" name="email" placeholder="Nom Complet" required="">
                <i class="bx bxs-user"></i>
            </div>
            <div class="input-box">
                <input type="password" id="id_password" name="mot_de_passe"  placeholder="Mot de passe" required="">
                <i class="bx bxs-lock-alt"></i>
            </div>

            <div class="remember-forgot">
                <label>
                    <input type="checkbox" name="remember_me">
                    Se souvenir de moi
                </label>
                <a href="#">Mot de passe oublié ?</a>
            </div>
                
            <button type="submit" class="btn">Connexion </button>
        </form>
    </div>
</body>

</html>
