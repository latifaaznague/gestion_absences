<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); width: 300px; }
        h2 { text-align: center; margin-bottom: 20px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }
        button { width: 100%; padding: 10px; margin-top: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        .error { color: red; text-align: center; }
    </style>
</head>
<body>
<div class="login-box">
    <h2>Connexion</h2>
    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}
    
    <!-- CORRECTION : Enlevez l'action ou utilisez l'URL correcte -->
    <form method="POST" action="/accounts/login/">
    {% csrf_token %}
     <input type="email" name="email" placeholder="Email" required>
     <input type="password" name="motDePasse" placeholder="Mot de passe" required>
    <button type="submit">Se connecter</button>
</form>
</div>
</body>
</html>
