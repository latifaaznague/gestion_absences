{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Connexion - Gestion des Absences</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap");
        
        *{
            margin: 0;
            padding: 0;
            box-sizing:border-box;
            font-family:"Poppins",sans-serif;
        }

        body{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url('{% static "login.jpg" %}');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
        }
        
        body::before{
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-position: right;
            filter: brightness(40%);
            z-index:-1;
            transition: filter 0.5s ease;
        }

        .wrapper{
            width:420px;
            background: transparent;
            border: 2px solid rgba(255, 255,255, .2);
            backdrop-filter: blur(20px);
            box-shadow: 0 0 10px rgb(0, 0, 0, .2);
            color:#fff;
            border-radius: 10px;
            padding: 30px 40px;
            position: relative;
            z-index: 1;
        }

        .wrapper h1 {
            font-size: 36px;
            text-align: center;
            margin-bottom: 20px;
        }

        .wrapper .input-box {
            position: relative;
            width:100%;
            height: 50px;
            margin:30px 0;
        }

        .input-box input{
            width:100%;
            height: 100%;
            background:transparent;
            border: none;
            outline: none;
            border: 2px solid rgba(255, 255,255, .2);
            border-radius: 40px; 
            font-size: 16px;
            color: #fff;
            padding: 20px 45px 20px 20px;
        }

        .input-box input::placeholder{
            color: rgba(255, 255, 255, 0.7);
        }

        .input-box i{
            position: absolute;
            right: 20px;
            top:50%;
            transform: translateY(-50%);
            font-size: 20px;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            font-size: 14.5px;
            margin: 15px 0 25px;
        }

        .remember-forgot label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }
        
        .remember-forgot input[type="checkbox"] {
            accent-color: #fff;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .remember-forgot a {
            color:rgba(255, 234, 167, 0.7);
            font-size: 13.5px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .remember-forgot a:hover {
            color:  #e0e0e0;
            text-decoration: underline;
            text-underline-offset: 3px;
        }

        .wrapper .btn{
            width: 100%;
            height: 45px;
            background: #fff;
            border:none;
            outline: none;
            border-radius: 40px;
            box-shadow: 0 0 10px rgb(0, 0, 0, .1);
            cursor: pointer;
            font-size: 16px;
            color: #333;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        /* Animation du bouton et du fond */
        .btn:hover {
            background: #e0e0e0;
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .btn:hover ~ body::before,
        body:has(.btn:hover)::before {
            filter: brightness(20%) !important;
        }

        /* Messages d'alerte */
        .alert {
            background-color: #f44336;
            color: white;
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 5px;
            text-align: center;
            display: none;
        }

        .alert.success {
            background-color: #4CAF50;
        }

        .alert.warning {
            background-color: #ff9800;
        }

        .alert.info {
            background-color: #2196F3;
        }

        /* Indicateur de chargement */
        .loading {
            display: none;
            text-align: center;
            margin: 15px 0;
            color: rgba(255, 255, 255, 0.8);
        }

        .loading i {
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Indicateur de rôle */
        .role-indicator {
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 5px;
            display: none;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .wrapper {
                width: 90%;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <h1>Connexion</h1>

        <!-- Message d'erreur/succès -->
        <div class="alert" id="messageAlert"></div>

        <!-- Indicateur de rôle -->
        <div class="role-indicator" id="roleIndicator">
            <i class='bx bx-user'></i> 
            <span id="roleText"></span>
        </div>

        <form id="loginForm">
            {% csrf_token %}
            
            <div class="input-box">
                <input type="email" id="email" name="email" placeholder="Adresse email" required>
                <i class='bx bx-envelope'></i>
            </div>
            <div class="input-box">
                <input type="password" id="motDePasse" name="motDePasse" placeholder="Mot de passe" required>
                <i class='bx bx-lock-alt'></i>
            </div>

            <div class="remember-forgot">
                <label>
                    <input type="checkbox" id="rememberMe">
                    Se souvenir de moi
                </label>
                <a href="#" id="forgotPassword">Mot de passe oublié ?</a>
            </div>

            <!-- Indicateur de chargement -->
            <div class="loading" id="loading">
                <i class='bx bx-loader'></i> Connexion en cours...
            </div>
                
            <button type="submit" class="btn">Connexion</button>
        </form>
    </div>

    <script>
        // URL de l'API Django
        const API_LOGIN_URL = '/api/login/';
        
        // Éléments DOM
        const loginForm = document.getElementById('loginForm');
        const messageAlert = document.getElementById('messageAlert');
        const loading = document.getElementById('loading');
        const roleIndicator = document.getElementById('roleIndicator');
        const roleText = document.getElementById('roleText');

        // Gestion de la soumission du formulaire
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const motDePasse = document.getElementById('motDePasse').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
            
            // Valider les entrées
            if (!email || !motDePasse) {
                showMessage('Veuillez remplir tous les champs', 'warning');
                return;
            }
            
            // Afficher le chargement
            loading.style.display = 'block';
            hideMessage();
            roleIndicator.style.display = 'none';
            
            try {
                // Appeler l'API Django
                const response = await fetch(API_LOGIN_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrfToken
                    },
                    body: JSON.stringify({
                        email: email.trim(),
                        motDePasse: motDePasse
                    })
                });
                
                const data = await response.json();
                loading.style.display = 'none';
                
                if (data.success) {
                    const user = data.user;
                    
                    // Afficher le rôle détecté
                    roleText.textContent = `Connecté en tant que ${user.role || user.type_utilisateur}`;
                    roleIndicator.style.display = 'block';
                    
                    showMessage('Connexion réussie ! Redirection en cours...', 'success');
                    
                    // Sauvegarder les données si "Se souvenir de moi" est coché
                    if (rememberMe) {
                        localStorage.setItem('rememberEmail', email);
                    } else {
                        localStorage.removeItem('rememberEmail');
                    }
                    
                    // Rediriger après 1.5 secondes
                    setTimeout(() => {
                        window.location.href = data.redirect || '/';
                    }, 1500);
                } else {
                    showMessage(data.message || 'Erreur de connexion', 'error');
                }
                
            } catch (error) {
                loading.style.display = 'none';
                showMessage('Erreur de connexion au serveur', 'error');
                console.error('Erreur:', error);
            }
        });
        
        // Fonctions d'affichage des messages
        function showMessage(message, type = 'info') {
            messageAlert.textContent = message;
            messageAlert.className = `alert ${type}`;
            messageAlert.style.display = 'block';
        }
        
        function hideMessage() {
            messageAlert.style.display = 'none';
        }
        
        // Remplir automatiquement l'email si "se souvenir de moi" était coché
        document.addEventListener('DOMContentLoaded', function() {
            const savedEmail = localStorage.getItem('rememberEmail');
            if (savedEmail) {
                document.getElementById('email').value = savedEmail;
                document.getElementById('rememberMe').checked = true;
            }
        });
        
        // Gestion du mot de passe oublié
        document.getElementById('forgotPassword').addEventListener('click', function(e) {
            e.preventDefault();
            showMessage('Fonctionnalité en cours de développement', 'info');
        });
    </script>
</body>
</html>
